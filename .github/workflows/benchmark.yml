name: Private benchmark
on:
  workflow_dispatch:
    inputs:
      events:
        description: Generated event count
        type: choice
        options: ['1000000', '20000000', '60000000']
        default: '20000000'
      repeats:
        description: Number of scale runs
        type: choice
        options: ['1', '3', '5']
        default: '3'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install checker
        run: python3 -m pip install polars==1.39.0
      - name: Show host
        run: |
          lscpu | head -26
          free -h
          df -h .
      - name: Check official answers and measure the container
        run: bash scripts/bench.sh '${{ inputs.events }}' 19 '${{ inputs.repeats }}'
